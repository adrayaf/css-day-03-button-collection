<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Collection - Day 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="container">
        <h1 class="title">Button Collection</h1>
        <p class="subtitle">10 variasi tombol dengan hover effect</p>
        
        <div class="buttons-grid">
            <!-- 1. Primary -->
            <button class="btn btn-primary">Primary</button>
            <!-- 2. Outline -->
            <button class="btn btn-outline">Outline</button>
            <!-- 3. Ghost -->
            <button class="btn btn-ghost">Ghost</button>
            <!-- 4. Gradient  -->
            <button class="btn btn-gradient">Gradient</button>
            <!-- 5. 3D -->
            <button class="btn btn-3d">3D</button>
            <!-- 6. Neon -->
            <button class="btn btn-neon">Neon</button>
            <!-- 7. Icon -->
            <button class="btn btn-icon">
                <span>🚀</span> Launch
            </button>
            <!-- 8. Loading -->
            <button class="btn btn-loading">
                <span class="spinner"></span>Loading
            </button>
            <!-- 9. Disabled -->
            <button class="btn btn-disabled">Disabled</button>
            <!-- 10. Pill -->
            <button class="btn btn-pill">Pill</button>
        </div>

    </section>

</body>
</html>
